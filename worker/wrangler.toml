# Cloudflare deploys the server from this folder automatically whenever main changes on GitHub
# (Workers Builds: root directory "worker", deploy command "npx wrangler deploy").
# Everything the live server needs is listed here, because a deploy replaces settings with what this file says.
# Secrets (PASSCODE, GEMINI_API_KEY, GROQ_API_KEY, TELEGRAM_BOT_TOKEN...) are NOT stored here and are never touched by a deploy.

name = "meja-copy"
main = "worker.js"
compatibility_date = "2026-11-13"
workers_dev = true
keep_vars = true   # never wipe variables someone added in the dashboard

[vars]
ALLOWED_ORIGIN = "https://nuhihsan.github.io,https://mejacopyhannah.pages.dev"
PROVIDER_ORDER = "gemini,workersai,groq"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "STORE"
id = "ea6f1d192658469fa06114d8559c15ef"

[triggers]
crons = ["39 23 * * SUN"]   # Monday 7:39am Malaysia time: trend board + weekly Telegram summary

[observability]
enabled = true
